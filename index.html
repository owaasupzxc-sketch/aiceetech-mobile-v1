<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677c8"><meta name="description" content="AI'ceeTech Mobile — a phone-first desktop environment">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>AI'ceeTech Mobile V1</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-logo">AI'ceeTech</div><div>Starting your desktop…</div><div class="bootbar"><i></i></div><button id="startNow">Start now</button></div>
<div id="desktop" class="desktop hidden">
  <div class="wallpaper-glow"></div>
  <header class="topline"><span>AI'ceeTech Mobile</span><span id="topClock"></span></header>
  <main id="icons" class="desktop-icons">
    <button class="deskicon" data-app="browser"><span>🌐</span>Browser</button>
    <button class="deskicon" data-app="notes"><span>📝</span>Notes</button>
    <button class="deskicon" data-app="calculator"><span>🧮</span>Calculator</button>
    <button class="deskicon" data-app="paint"><span>🎨</span>Paint</button>
    <button class="deskicon" data-app="files"><span>📁</span>File Manager</button>
    <button class="deskicon" data-app="settings"><span>⚙️</span>Settings</button>
    <button class="deskicon" data-app="agent"><span>🤖</span>Owaa Tech</button>
    <button class="deskicon" data-app="hub"><span>🧰</span>Microsoft Hub</button>
    <button class="deskicon" data-app="control"><span>🎛️</span>Control Center</button>
  </main>
  <section id="windows" aria-live="polite"></section>
  <nav class="taskbar"><button id="startButton" class="start-button">✦ Start</button><div id="taskItems" class="task-items"></div><button id="quickSettings" class="tray">⚙️ <span id="trayClock"></span></button></nav>
  <section id="startMenu" class="start-menu hidden">
    <div class="start-head"><b>AI'ceeTech</b><input id="appSearch" placeholder="Search apps…"></div>
    <div class="app-grid">
      <button data-open="browser">🌐 Browser</button><button data-open="notes">📝 Notes</button><button data-open="calculator">🧮 Calculator</button><button data-open="paint">🎨 Paint</button><button data-open="files">📁 File Manager</button><button data-open="settings">⚙️ Settings</button><button data-open="agent">🤖 Owaa Tech</button><button data-open="hub">🧰 Microsoft Hub</button><button data-open="control">🎛️ Control Center</button>
    </div>
    <div class="start-foot">Phone-first desktop · V1</div>
  </section>
  <section id="toast" class="toast hidden"></section>
</div>
<script src="app.js"></script>
</body></html>
